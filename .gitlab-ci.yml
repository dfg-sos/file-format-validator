workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never
stages:
  - test
test:
  stage: test
  image: logru/format-validator-deps:latest
  tags: [secloud]
  script:
    - python -m venv venv
    - source venv/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install .[test]
    - python -m pytest
