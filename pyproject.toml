[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["format_validator*"]

[project]
name = "format-validator"
version = "0.5.0"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Moritz Pataky", email = "moritz.pataky@stud-mail.uni-wuerzburg.de" },
    { name = "Lorenz Gruber", email = "lorenz.gruber@uni-wuerzburg.de" }
]

requires-python = ">=3.13"

dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "format-validator-eo",
]

[tool.uv.workspace]
members = ["plugins/eo"]

[tool.uv.sources]
format-validator-eo = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [".", "plugins/eo"]
testpaths = ["test", "plugins/eo/tests"]
