[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["format_validator*"]

[project]
name = "format-validator"
version = "0.2.0"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Moritz Pataky", email = "moritz.pataky@stud-mail.uni-wuerzburg.de" },
    { name = "Lorenz Gruber", email = "lorenz.gruber@uni-wuerzburg.de" }
]

requires-python = ">=3.13"

dependencies = [
    "geopandas",
    "pyarrow",
    "pandas",
    "shapely",
    "netcdf4",
    "xarray",
    "pyproj",
    "fiona",
    "rasterio",
    "cfgrib",
    "rio_cogeo",
    "eccodeslib"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov"
]

[tool.pytest.ini_options]
pythonpath = ["."]