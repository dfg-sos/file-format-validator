name: test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: logru/format-validator-deps:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install .[test]
          python -m pytest
